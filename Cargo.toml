[package]
name = "legado-rust-engine"
version = "0.1.0"
edition = "2024"
description = "Rust 重写 legado 核心引擎：门面 crate，统一再导出各模块"
license = "AGPL-3.0"
repository = "https://gitea.slcomplex.party/OpenToGithub/legado-rust-engine-code"
readme = "README.md"
keywords = ["legado", "book-source", "scraper", "rule-engine"]
categories = ["web-programming", "parsing"]
# 发布到 crates.io 的包里不需要对拍语料与仓库内验收脚本（fixtures 约 9MB）
exclude = ["fixtures/**", "scripts/**", ".github/**"]

[workspace]
members = ["crates/*"]

[workspace.dependencies]
bytes = "1"
chardetng = "0"
encoding_rs = "0"
regex = "1"
futures = "0.3"
http = "1"
aes = "0.8"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
ecb = "0.1"
des = "0.8"
rand = "0.8"
zhconv = "0.4"
libxml = "0"
psl = "2"
quick-xml = "0.38"
reqwest = { version = "0", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "gzip",
    "brotli",
    "http2",
] }
scraper = { version = "0", features = ["deterministic"] }
html5ever = "0.39"
serde_json_path = "0"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0"
url = "2"
moka = { version = "0", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"

redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
] }

legado-book = { version = "0.1.0", path = "crates/legado-book" }
legado-core = { version = "0.1.0", path = "crates/legado-core" }
legado-js = { version = "0.1.0", path = "crates/legado-js" }
legado-net = { version = "0.1.0", path = "crates/legado-net" }
legado-regex = { version = "0.1.0", path = "crates/legado-regex" }
legado-replace = { version = "0.1.0", path = "crates/legado-replace" }
legado-rule = { version = "0.1.0", path = "crates/legado-rule" }
legado-rss = { version = "0.1.0", path = "crates/legado-rss" }

[dependencies]
legado-book.workspace = true
legado-core.workspace = true
legado-js.workspace = true
legado-net.workspace = true
legado-regex.workspace = true
legado-replace.workspace = true
legado-rule.workspace = true
legado-rss.workspace = true

[features]
redis = ["legado-core/redis"]

[dev-dependencies]
base64 = "0.22"
md-5 = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
