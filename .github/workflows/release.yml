name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only compute the version, do not verify/commit/tag/publish
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py \
            --bump "$BUMP" \
            --notes-file target/release-notes.md \
            --github-output "$GITHUB_OUTPUT"
          {
            echo "### Release plan"
            echo
            cat target/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to release
        if: steps.version.outputs.tag == ''
        run: echo "::notice::没有需要发版的提交（feat/fix/perf/破坏性变更），本次跳过"

  verify:
    name: Verify before tagging
    needs: plan
    if: needs.plan.outputs.tag != '' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxml2-dev libclang-dev libicu-dev
          libclang="$(find /usr/lib /usr/local/lib -name 'libclang.so' 2>/dev/null | head -n1)"
          if [ -n "$libclang" ]; then
            echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Toolchain info
        run: |
          rustc --version
          cargo --version
          cc --version | head -n1
          pkg-config --modversion libxml-2.0 icu-i18n
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-<unset>}"

      - name: Build workspace (all targets)
        run: cargo build --workspace --all-targets

      - name: Offline acceptance suite (fmt + clippy + examples)
        run: |
          set -o pipefail
          bash scripts/run-tests.sh 2>&1 | tee "${RUNNER_TEMP}/acceptance.log"

      - name: Show acceptance failure tail
        if: failure()
        run: |
          {
            echo "## Acceptance suite failed"
            echo
            echo '~~~'
            tail -n 80 "${RUNNER_TEMP}/acceptance.log"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-log
          path: ${{ runner.temp }}/acceptance.log
          if-no-files-found: ignore

      - name: Build .crate archives
        run: cargo package --workspace --locked --no-verify

  release:
    name: Bump version and tag
    needs: [plan, verify]
    if: needs.plan.outputs.tag != '' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply version bump
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          python3 scripts/release_version.py \
            --bump "$BUMP" \
            --apply \
            --notes-file target/release-notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Check crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::仓库没有配置 CARGO_REGISTRY_TOKEN secret，取消发版（未打 tag）"
            exit 1
          fi

      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Create and push tag
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::tag $tag 已存在，跳过创建"
          else
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::release $tag 已存在，跳过"
          else
            gh release create "$tag" --title "$tag" --notes-file target/release-notes.md
          fi

  publish:
    name: Publish to crates.io
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      dry_run: false
      skip_verify: true
    secrets: inherit
