name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only package, do not publish to crates.io
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        description: Tag to publish (created by the auto-release workflow)
        type: string
        required: false
        default: ""
      dry_run:
        description: Only package, do not publish
        type: boolean
        required: false
        default: false
      skip_verify:
        description: Skip the verify job (caller already ran the test suite)
        type: boolean
        required: false
        default: false
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRATES: >-
    legado-core legado-regex legado-rule legado-net legado-js
    legado-replace legado-book legado-rss legado-rust-engine

jobs:
  verify:
    name: Verify and package
    if: inputs.skip_verify != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxml2-dev libclang-dev libicu-dev
          libclang="$(find /usr/lib /usr/local/lib -name 'libclang.so' 2>/dev/null | head -n1)"
          if [ -n "$libclang" ]; then
            echo "LIBCLANG_PATH=$(dirname "$libclang")" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Toolchain info
        run: |
          rustc --version
          cargo --version
          cc --version | head -n1
          pkg-config --modversion libxml-2.0 icu-i18n
          echo "LIBCLANG_PATH=${LIBCLANG_PATH:-<unset>}"

      - name: Build workspace (all targets)
        run: cargo build --workspace --all-targets

      - name: Offline acceptance suite (fmt + clippy + examples)
        run: |
          set -o pipefail
          bash scripts/run-tests.sh 2>&1 | tee acceptance.log

      - name: Show acceptance failure tail
        if: failure()
        run: |
          {
            echo "## Acceptance suite failed"
            echo
            echo '~~~'
            tail -n 80 acceptance.log
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload acceptance log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-log
          path: acceptance.log
          if-no-files-found: ignore

      - name: Build .crate archives
        run: cargo package --workspace --locked --no-verify

      - name: Upload .crate archives
        uses: actions/upload-artifact@v4
        with:
          name: crates-package
          path: target/package/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs: verify
    if: always() && inputs.dry_run != true && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Check versions
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "legado-rust-engine"))')"
          echo "workspace version: $version"
          distinct="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(len({p["version"] for p in json.load(sys.stdin)["packages"]}))')"
          if [ "$distinct" != "1" ]; then
            echo "::error::workspace 内各 crate 版本不一致，先把版本改成同一个再发布"
            exit 1
          fi
          expected="${EXPECTED_TAG:-}"
          if [ -z "$expected" ] && [ "$REF_TYPE" = "tag" ]; then
            expected="$REF_NAME"
          fi
          if [ -n "$expected" ] && [ "$expected" != "v$version" ]; then
            echo "::error::tag $expected 与 Cargo.toml 版本 v$version 不一致"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::缺少 CARGO_REGISTRY_TOKEN secret，无法发布到 crates.io"
            exit 1
          fi
          for crate in $CRATES; do
            if curl -fsS --max-time 20 \
                -H 'User-Agent: legado-rust-engine-release-action' \
                "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null 2>&1; then
              echo "::notice::${crate} ${VERSION} 已发布，跳过"
              continue
            fi
            echo "publishing ${crate} ${VERSION}"
            for attempt in 1 2 3 4 5; do
              if cargo publish -p "${crate}" --locked --no-verify; then
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${crate} ${VERSION} 发布失败"
                exit 1
              fi
              delay=$((attempt * 20))
              echo "publish 失败（第 ${attempt} 次），${delay}s 后重试"
              sleep "${delay}"
            done
            sleep 20
          done
          echo "::notice::全部 crate 已发布 ${VERSION}"

      - name: Skip notice (dry run)
        if: inputs.dry_run == true
        run: echo "::notice::dry_run 模式：只打包未发布，.crate 产物见 verify job 的 artifact"
